name: Bug report
description: Report something in Mizar that does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: report
    attributes:
      label: What went wrong?
      description: Tell us how to reproduce it, what happened, and what you expected. Include your Mizar version and OS if you can. Remove secrets before sharing logs.
    validations:
      required: true
