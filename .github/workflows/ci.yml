name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Read Rust toolchain version
        id: rust-version
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-version.outputs.channel }}
          components: rustfmt, clippy

      - name: Install Linux fast linker (mold) and ripgrep
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mold clang ripgrep

      - name: Install macOS ripgrep
        if: runner.os == 'macOS'
        run: command -v rg >/dev/null 2>&1 || brew install ripgrep

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Set build optimization env
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          if [ "${{ runner.os }}" = "Linux" ]; then
            echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold -C split-debuginfo=unpacked" >> "$GITHUB_ENV"
          fi

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Check core without default features
        run: cargo check --locked -p mizar-core --no-default-features --all-targets

      - name: Clippy check
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --locked --workspace --no-fail-fast
