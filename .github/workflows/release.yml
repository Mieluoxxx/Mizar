name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish (e.g. v0.1.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Validate release tag
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi

          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag '$tag': expected SemVer like v0.1.0 or v0.1.0-alpha.1" >&2
            exit 1
          fi

          version="${tag#v}"
          prerelease="false"
          if [[ "$version" == *-* ]]; then
            prerelease="true"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Verify tag exists on remote
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/${REPO}/git/ref/tags/${TAG}" > /dev/null

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: true
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}

      - name: Read Rust toolchain version
        id: rust-version
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-version.outputs.channel }}
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        env:
          MIZAR_VERSION: ${{ needs.prepare.outputs.version }}
        run: cargo build --release --locked --target "${{ matrix.target }}" -p mizar-tui --bin mizar

      - name: Verify built binary
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
          CROSS: ${{ matrix.cross }}
        run: |
          set -euo pipefail
          bin="target/${TARGET}/release/mizar"
          test -x "$bin"
          if [ "$CROSS" = "true" ]; then
            lipo "$bin" -info
            lipo "$bin" -verify_arch x86_64
          else
            "$bin" --version | grep -Fx "mizar ${EXPECTED_VERSION}"
          fi

      - name: Package release archive
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          stage="mizar-${TAG}-${TARGET}"
          mkdir -p "dist/${stage}"
          cp "target/${TARGET}/release/mizar" "dist/${stage}/mizar"
          chmod 755 "dist/${stage}/mizar"
          cp LICENSE README.md "dist/${stage}/"
          tar -C dist -czf "dist/${stage}.tar.gz" "${stage}"
          rm -rf "dist/${stage}"

      - name: Upload target archive
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: release-assets
          merge-multiple: true

      - name: Prepare checksums and installer
        run: |
          set -euo pipefail
          if [ -f scripts/install.sh ]; then
            cp scripts/install.sh release-assets/install.sh
            chmod 755 release-assets/install.sh
          fi
          (cd release-assets && sha256sum mizar-*.tar.gz > checksums.txt)
          cat release-assets/checksums.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            flags=(--title "Mizar $TAG" --generate-notes)
            if [ "$PRERELEASE" = "true" ]; then
              flags+=(--prerelease)
            fi
            gh release create "$TAG" release-assets/* "${flags[@]}"
          fi
