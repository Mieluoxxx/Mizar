[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
axum = "0.8"
base64 = "0.22"
chrono = "0.4"
crossterm = "0.29"
dirs = "7"
futures = "0.3"
globset = "0.4"
ignore = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
libc = "0.2"
loom = "0.7"
ratatui = "0.30"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "charset", "http2", "system-proxy"] }
rquickjs = { version = "0.14", features = ["futures", "parallel"] }
rusqlite = "0.43"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt", "sync"] }
tokio-util = { version = "0.7", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std"] }
unicode-normalization = "0.1"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }

mizar-types = { path = "crates/mizar-types" }
mizar-llm = { path = "crates/mizar-llm" }
mizar-tools = { path = "crates/mizar-tools" }
mizar-session = { path = "crates/mizar-session" }
mizar-codemode = { path = "crates/mizar-codemode" }
mizar-mcp = { path = "crates/mizar-mcp" }
mizar-core = { path = "crates/mizar-core" }
mizar-client = { path = "crates/mizar-client" }
mizar-tui-ui = { path = "crates/mizar-tui-ui" }
mizar-tui = { path = "crates/mizar-tui" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mizar_loom)'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.test]
inherits = "dev"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
