[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/*"]

[workspace.package]
version = "0.2.3"
edition = "2024"
license = "MIT"

[workspace.dependencies]
axum = "0.8"
base64 = "0.22"
chrono = "0.4"
crossterm = "0.29"
dirs = "7"
futures = "0.3"
globset = "0.4"
ignore = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
libc = "0.2"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "charset", "http2", "system-proxy"] }
rquickjs = { version = "0.14", features = ["futures", "parallel"] }
rusqlite = "0.43"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt", "sync"] }
tokio-util = { version = "0.7", default-features = false }
unicode-normalization = "0.1"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }

cordis = { path = "crates/cordis" }
mizar-llm-types = { path = "crates/mizar-llm-types" }
mizar-llm = { path = "crates/mizar-llm" }
mizar-llm-http = { path = "crates/mizar-llm-http" }
mizar-llm-completions = { path = "crates/mizar-llm-completions" }
mizar-llm-messages = { path = "crates/mizar-llm-messages" }
mizar-llm-mock = { path = "crates/mizar-llm-mock" }
mizar-llm-responses = { path = "crates/mizar-llm-responses" }
mizar-llm-retry = { path = "crates/mizar-llm-retry" }
mizar-llm-router = { path = "crates/mizar-llm-router" }
mizar-session = { path = "crates/mizar-session" }
mizar-session-sqlite = { path = "crates/mizar-session-sqlite" }
mizar-session-title = { path = "crates/mizar-session-title" }
mizar-tools = { path = "crates/mizar-tools" }
mizar-tools-coding = { path = "crates/mizar-tools-coding" }
mizar-codemode = { path = "crates/mizar-codemode" }
mizar-tool-fs = { path = "crates/mizar-tool-fs" }
mizar-tool-search = { path = "crates/mizar-tool-search" }
mizar-tool-time = { path = "crates/mizar-tool-time" }
mizar-mcp = { path = "crates/mizar-mcp" }
mizar-skills = { path = "crates/mizar-skills" }
mizar-instructions = { path = "crates/mizar-instructions" }
mizar-compaction = { path = "crates/mizar-compaction" }
mizar-recall = { path = "crates/mizar-recall" }
mizar-system-prompt = { path = "crates/mizar-system-prompt" }
mizar-agent-loop = { path = "crates/mizar-agent-loop" }
mizar-agent-spine = { path = "crates/mizar-agent-spine" }
mizar-trajectory-core = { path = "crates/mizar-trajectory-core" }
mizar-trajectory = { path = "crates/mizar-trajectory" }
mizar-client-core = { path = "crates/mizar-client-core" }
mizar-client = { path = "crates/mizar-client" }
mizar-tui-ui = { path = "crates/mizar-tui-ui" }
mizar-tui = { path = "crates/mizar-tui" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
