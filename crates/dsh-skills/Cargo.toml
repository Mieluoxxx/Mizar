[package]
name = "dsh-skills"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "渐进式技能发现、分层注册表、热失效与按需加载工具（参考 deepseek-harness packages/skill）"

[lints]
workspace = true

[dependencies]
cordis = { workspace = true }
dirs = { workspace = true }
dsh-agent-loop = { workspace = true }
dsh-llm = { workspace = true }
dsh-session = { workspace = true }
dsh-tools = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros"] }
tokio-util = { workspace = true }

[dev-dependencies]
dsh-system-prompt = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
