[package]
name = "dsh-agent-spine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "核心套件插件，一次性装配 Agent 核心服务与按需特性插件（对应 NamiDSH packages/agent-spine）"

[lints]
workspace = true

[features]
default = ["legacy", "coding", "sqlite", "trajectory", "router"]
legacy = ["dep:dsh-tool-fs", "dep:dsh-tool-time"]
coding = [
    "dep:dsh-tools-coding",
    "dep:dsh-tool-search",
    "dep:dsh-codemode",
    "dep:dsh-mcp",
    "dep:dsh-skills",
]
sqlite = ["dep:dsh-session-sqlite"]
trajectory = ["dep:dsh-trajectory"]
router = ["dep:dsh-llm-router"]

[dependencies]
cordis = { workspace = true }
dirs = { workspace = true }
dsh-agent-loop = { workspace = true }
dsh-codemode = { workspace = true, optional = true }
dsh-llm = { workspace = true }
dsh-llm-router = { workspace = true, optional = true }
dsh-mcp = { workspace = true, optional = true }
dsh-session = { workspace = true }
dsh-session-sqlite = { workspace = true, optional = true }
dsh-skills = { workspace = true, optional = true }
dsh-system-prompt = { workspace = true }
dsh-tool-fs = { workspace = true, optional = true }
dsh-tool-search = { workspace = true, optional = true }
dsh-tool-time = { workspace = true, optional = true }
dsh-tools = { workspace = true }
dsh-tools-coding = { workspace = true, optional = true }
dsh-trajectory = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
dsh-llm-mock = { workspace = true }
dsh-llm-retry = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "time"] }
tokio-util = { workspace = true }
