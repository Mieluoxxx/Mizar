[package]
name = "mizar-cache-warming"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Prompt Cache 后台定时续命保活插件（四道安全门禁、$0.05 期望收益测算与休眠截止线）"

[lints]
workspace = true

[features]
default = []

[dependencies]
cordis = { workspace = true }
futures = { workspace = true }
mizar-agent-loop = { workspace = true }
mizar-client-core = { workspace = true }
mizar-llm = { workspace = true }
mizar-session = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tokio-util = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "time"] }
