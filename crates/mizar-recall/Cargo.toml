[package]
name = "mizar-recall"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "无损情景回溯插件（统一只读 recall 工具，穿透压缩与谱系边界）"

[lints]
workspace = true

[dependencies]
cordis = { workspace = true }
mizar-agent-loop = { workspace = true }
mizar-llm = { workspace = true }
mizar-session = { workspace = true }
mizar-tools = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs"] }

[dev-dependencies]
mizar-session-sqlite = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-util = { workspace = true }
