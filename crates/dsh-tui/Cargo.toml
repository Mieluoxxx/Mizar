dsh-llm-retry = { workspace = true }
dsh-llm-router = { workspace = true }
dsh-mcp = { workspace = true }
dsh-session = { workspace = true }
dsh-skills = { workspace = true }
dsh-system-prompt = { workspace = true }
dsh-tools = { workspace = true }
dsh-tools-coding = { workspace = true }
dsh-trajectory = { workspace = true }
dsh-tui-ui = { workspace = true }
futures = { workspace = true }
ratatui = { workspace = true }
